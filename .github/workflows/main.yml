
name: Build FF Tournament Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ff-tournament-arena-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare Capacitor
        run: |
          set -e

          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6 @capacitor/assets sharp

          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp service-worker.js www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.redoan21.ffarena",
            "appName": "FF Tournament Arena",
            "webDir": "www"
          }
          EOF

          npx cap add android
                    # Set Android app version
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i "s/versionName '1.0'/versionName '1.1'/" android/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'

          if permission not in source:
              match = re.search(r"<manifest\b[^>]*>", source)
              if match is None:
                  raise SystemExit("Manifest tag not found")
              source = source[:match.end()] + "\n" + permission + source[match.end():]
              manifest.write_text(source)
          PY
                    mkdir -p android/app/src/main/java/com/redoan21/ffarena

          cat > android/app/src/main/java/com/redoan21/ffarena/MainActivity.java <<'EOF'
          package com.redoan21.ffarena;

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.net.Uri;
          import android.os.Environment;
          import android.os.Build;
          import android.provider.Settings;
          import android.content.pm.PackageManager;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getBridge().getWebView().addJavascriptInterface(new Object() {
                  @JavascriptInterface
public void downloadUpdate(String apkUrl) {
    DownloadManager.Request request = new DownloadManager.Request(Uri.parse(apkUrl));
    request.setTitle("FF Tournament Arena Update");
    request.setDescription("Downloading update...");
    request.setNotificationVisibility(
        DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED
    );
    request.setDestinationInExternalFilesDir(
        MainActivity.this,
        Environment.DIRECTORY_DOWNLOADS,
        "FF-Tournament-Arena.apk"
    );

    DownloadManager manager =
        (DownloadManager) MainActivity.this.getSystemService(Context.DOWNLOAD_SERVICE);
final long[] downloadId = new long[1];

BroadcastReceiver receiver = new BroadcastReceiver() {
    @Override
    public void onReceive(Context context, Intent intent) {
        long completedId = intent.getLongExtra(
            DownloadManager.EXTRA_DOWNLOAD_ID, -1
        );

        if (completedId == downloadId[0]) {
            Uri apkUri = manager.getUriForDownloadedFile(completedId);

            if (apkUri != null) {
                Intent installIntent = new Intent(Intent.ACTION_VIEW);
                installIntent.setDataAndType(
                    apkUri,
                    "application/vnd.android.package-archive"
                );
                installIntent.addFlags(
                    Intent.FLAG_ACTIVITY_NEW_TASK |
                    Intent.FLAG_GRANT_READ_URI_PERMISSION
                );
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
    !MainActivity.this.getPackageManager().canRequestPackageInstalls()

    Intent settingsIntent = new Intent(
        Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
        Uri.parse("package:" + MainActivity.this.getPackageName())
    );

    settingsIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
    MainActivity.this.startActivity(installIntent);

} else {
    MainActivity.this.startActivity(settingsIntent);
}
            }

            unregisterReceiver(this);
        }
    }
};

IntentFilter filter = new IntentFilter(
    DownloadManager.ACTION_DOWNLOAD_COMPLETE
);

if (Build.VERSION.SDK_INT >= 33) {
    registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED);
} else {
    registerReceiver(receiver, filter);
}

downloadId[0] = manager.enqueue(request);

}
                      @JavascriptInterface
                      public void exitApp() {
                          runOnUiThread(() -> finish());
                      }
                  }, "NativeApp");
              }

              @Override
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().evaluateJavascript(
                          "window.dispatchEvent(new Event('nativeBackButton'));",
                          null
                      );
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          mkdir -p resources

          node -e "require('sharp')('app-icon-256.png').resize(1024,1024).png().toFile('resources/icon.png')"

          npx capacitor-assets generate --android
          npx cap sync android

      - name: Setup Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEYSTORE_ALIAS"

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ff-tournament-release.jks

          test -s android/app/ff-tournament-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("ff-tournament-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEYSTORE_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }

          """

          if "signingConfigs {" in s:
              raise SystemExit("Signing config already exists")

          marker = "    buildTypes {"

          if marker not in s:
              raise SystemExit("Could not find buildTypes")

          s = s.replace(marker, signing + marker, 1)

          pattern = r"(buildTypes\s*\{\s*release\s*\{)"

          s, count = re.subn(
              pattern,
              r"\1\n            signingConfig signingConfigs.release",
              s,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not find release build type")

          p.write_text(s)
          PY

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -e

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          set -e

          cp android/app/build/outputs/apk/release/app-release.apk FF-Tournament-Arena.apk

          test -s FF-Tournament-Arena.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FF-Tournament-Arena-Release
          path: FF-Tournament-Arena.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: FF Tournament Arena v1.1.0
          body: |
            First official release of FF Tournament Arena Android App.
          files: FF-Tournament-Arena.apk
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          
