
name: Build FF Tournament Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare Capacitor
        run: |
          npm init -y

          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6 @capacitor/assets sharp

          mkdir -p www

          cp index.html www/
          cp manifest.json www/
          cp service-worker.js www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.redoan21.ffarena",
            "appName": "FF Tournament Arena",
            "webDir": "www"
          }
          EOF

          npx cap add android

          mkdir -p resources

          node -e "require('sharp')('app-icon-256.png').resize(1024,1024).png().toFile('resources/icon.png')"

          npx capacitor-assets generate --android

          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FF-Tournament-Arena.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-Tournament-Arena
          path: FF-Tournament-Arena.apk
          
